<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>King of Cards · Wedding Photography & Gifting</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2e2426;--maroon:#6b1426;--cream:#faf5ea;--paper:#fffdf8;--sand:#efe5d2;--line:#e2d6bd;--mut:#6f6256;--r:12px}
*{box-sizing:border-box;margin:0}
body{font-family:'Instrument Sans',system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;min-height:100vh}
h1,h2,h3,h4{font-family:'Montserrat',system-ui,sans-serif;font-weight:600;line-height:1.2;color:var(--maroon)}
button{font:inherit;cursor:pointer}
:focus-visible,label:focus-within{outline:3px solid var(--maroon);outline-offset:2px}
header.brand{max-width:1100px;margin:0 auto;padding:26px clamp(18px,4vw,52px) 0;font:700 20px 'Montserrat',sans-serif;color:var(--maroon)}
main{max-width:1100px;margin:0 auto;padding:22px clamp(18px,4vw,52px) 70px}
.view{display:none}.view.on{display:block}
.crumb{background:none;border:0;color:var(--mut);margin-bottom:16px;padding:0}.crumb:hover{color:var(--maroon)}
.hero{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(26px,5vw,50px)}
.hero h1{font-size:clamp(26px,4.2vw,40px);max-width:20ch}
.hero p{max-width:56ch;margin-top:14px;color:var(--mut);font-size:17px}
h2.sec{font-size:clamp(24px,3.2vw,34px);margin-bottom:6px}
.hd{font-size:22px;margin:44px 0 14px}
.sub{color:var(--mut);max-width:62ch}
.grid{display:grid;gap:20px;margin-top:22px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.body{padding:20px;display:flex;flex-direction:column;flex:1}
.vendor{display:flex;flex-direction:column}
.tag{font:500 17px 'Montserrat',sans-serif;color:var(--maroon);margin:2px 0 8px}
.usp{list-style:none;padding:0;margin:12px 0 20px;display:grid;gap:8px}
.usp li{padding-left:22px;position:relative;font-size:15px}
.usp li:before{content:"";position:absolute;left:2px;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--maroon)}
.hook{font:600 18px 'Montserrat',sans-serif;color:var(--maroon);margin:2px 0 0;line-height:1.3}
.btn{background:var(--maroon);color:var(--cream);border:0;border-radius:10px;padding:12px 24px;font-weight:600;margin-top:auto;align-self:flex-start;display:inline-block}
.btn:hover{background:#4d0e1b}
.btn.ghost{background:none;color:var(--maroon);border:1px solid var(--maroon);margin-top:14px}
.vh{position:absolute;width:1px;height:1px;opacity:0}
/* image frames: size follows the uploaded image */
.fr{display:block;position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sand)}
label.fr{cursor:pointer}
.chg{position:absolute;right:8px;bottom:8px;background:var(--maroon);color:var(--cream);font-size:13px;font-weight:600;padding:5px 12px;border-radius:20px;pointer-events:none;box-shadow:0 2px 6px #0003}
.vchg{pointer-events:auto;cursor:pointer;top:8px;bottom:auto}
.fr img,.fr video{display:block;width:100%;height:auto}
.fr .ph{display:grid;place-items:center;text-align:center;color:var(--maroon);padding:18px;aspect-ratio:var(--ar,4/3);font-size:14px}
.fr .ph small{color:var(--mut)}
.card>.fr{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.mas{column-count:3;column-gap:12px}
.mas figure{break-inside:avoid;margin:0 0 12px;position:relative}
.mas img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.mas figcaption{font-size:14px;color:var(--mut);padding-top:4px}
.del{position:absolute;top:6px;right:6px;border:0;background:#fffdf8e6;color:var(--maroon);border-radius:20px;width:26px;height:26px;font-weight:700}
label.del.rep{right:38px;display:grid;place-items:center;cursor:pointer;font-size:14px}
@media(max-width:800px){.mas{column-count:2}}@media(max-width:480px){.mas{column-count:1}}
.pts{padding-left:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px 28px}
.pts li{padding-left:22px;position:relative}
.pts li:before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--maroon)}
.q{display:flex;flex-direction:column;gap:12px;padding:4px 0}
.q p{font-size:15.5px}.q .who{display:flex;align-items:center;gap:12px}.q b{font:600 14px 'Montserrat',sans-serif;color:var(--maroon);display:block}.q span.ev{font-size:13px;color:var(--mut)}
.stars{color:var(--maroon);letter-spacing:2px;font-size:15px}
.av{width:52px;height:52px;border-radius:50%;overflow:hidden;position:relative;background:var(--sand);border:1px solid var(--line);display:grid;place-items:center;font:600 16px 'Montserrat',sans-serif;color:var(--maroon);flex-shrink:0}
label.av{cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.step{padding:22px}
.step .n{font:700 28px 'Montserrat',sans-serif;color:var(--maroon);opacity:.45;margin-bottom:6px}
.step h3,.pt h3{font-size:18px;margin-bottom:6px}.step p,.pt p{font-size:15px;color:var(--mut)}
.pt{padding:22px;border-left:3px solid var(--maroon)}
.pkg{padding:26px;display:flex;flex-direction:column}
.pkg h4{font-size:14px;margin:14px 0 6px}
.price{font:600 30px 'Montserrat',sans-serif;color:var(--ink);margin:4px 0 6px}
.pkg ul{padding-left:18px;font-size:14.5px}.pkg li{margin-bottom:3px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.cols{grid-template-columns:1fr}}
.lead{background:var(--sand);border-radius:16px;padding:clamp(22px,4vw,34px);margin-top:44px}
.lead h3{font-size:24px}.lead p{color:var(--mut);margin:6px 0 18px}
.lead form{display:flex;gap:12px;flex-wrap:wrap}
.lead input,.lead select{flex:1 1 200px;padding:13px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit}
.lead .btn{margin:0}
.err{color:var(--maroon);font-size:14px;width:100%;min-height:20px}
.ok{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-weight:500;color:var(--maroon)}
.occ{margin-top:0}.occ h4{margin:8px 0 0;font-size:15px}
.vname{font-size:clamp(34px,6vw,56px);font-weight:700;letter-spacing:-.01em;line-height:1.05}
.vtag{font-size:13.5px;color:var(--mut);margin-top:8px;max-width:60ch}
.vendor .body h3{font-size:clamp(26px,3.2vw,34px);font-weight:700;line-height:1.1;letter-spacing:-.01em;margin-bottom:6px}
.vendor .hook,.vendor .tag{font:500 14.5px 'Instrument Sans',sans-serif;color:var(--mut);margin:0 0 4px}
.vendor .body h3{font-size:clamp(21px,2.5vw,26px)}
.vname{font-size:clamp(28px,4.6vw,42px)}
h2.sec{font-size:clamp(22px,2.8vw,28px)}
.hd{font-size:20px}
.hero h1{font-size:clamp(24px,3.6vw,34px)}
.hero p b,.sub b{color:var(--ink);font-weight:600}
.hero h1{max-width:none}
/* editing */
[contenteditable]{outline:1px dashed #6b142666;outline-offset:2px;border-radius:3px;cursor:text}
[contenteditable]:focus{outline:2px solid var(--maroon);background:#fff7e0}
[contenteditable]:empty:before{content:"(empty)";opacity:.5}
.rm{border:0;background:none;color:var(--maroon);font-weight:700;margin-left:6px;opacity:.6}
.rm:hover{opacity:1}
.addb{background:none;border:1px dashed var(--maroon);color:var(--maroon);border-radius:8px;padding:2px 10px;font-size:13px}
li.addli{padding-left:0!important}
li.addli:before{display:none!important}
#adminbar button:disabled{opacity:.45;cursor:default}
#save{background:var(--cream)!important;color:var(--maroon)!important;font-weight:600}
/* admin bar + toast */
.foot{text-align:center;padding:0 0 40px}
.foot .btn{margin:0}
/* login dialog */
#loginbox{display:none;position:fixed;inset:0;z-index:40;background:#2e242699;align-items:center;justify-content:center;padding:18px}
#loginbox.on{display:flex}
#loginbox .dlg{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(22px,4vw,32px);width:100%;max-width:380px}
#loginbox h3{font-size:22px;margin-bottom:4px}
#loginbox p{color:var(--mut);font-size:14.5px;margin-bottom:16px}
#loginbox input[type=password],#loginbox input[type=text]{width:100%;padding:13px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit}
#loginbox .row{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px;color:var(--mut)}
#loginbox .acts{display:flex;gap:10px;margin-top:16px}
#loginbox .acts .btn{margin:0}
#lerr{color:var(--maroon);font-size:14px;min-height:20px;margin-top:10px}
#adminbar{display:none;position:sticky;top:0;z-index:20;background:var(--maroon);color:var(--cream);font-size:14px;padding:8px 16px;text-align:center}
#adminbar.on{display:block}
#adminbar button{background:none;border:1px solid var(--cream);color:var(--cream);border-radius:6px;padding:2px 10px;margin-left:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:30;display:none;max-width:90vw}
#toast.on{display:block}#toast.bad{background:#b00020}
.video-upload-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.video-upload-overlay.active {
  display: flex;
}

.video-upload-box {
  background: #fffdf8;
  border-radius: 16px;
  padding: 35px 25px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,0.2);
}

.video-upload-spinner {
  width: 50px;
  height: 50px;
  border: 5px solid #efe5d2;
  border-top-color: #6b1426;
  border-radius: 50%;
  animation: videoSpin 0.8s linear infinite;
  margin: 0 auto 20px;
}

@keyframes videoSpin {
  to { transform: rotate(360deg); }
}

#videoUploadMessage {
  margin-top: 12px;
  color: #6f6256;
}

#videoUploadClose {
  margin-top: 20px;
  background: #6b1426;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 10px 25px;
  cursor: pointer;
}
</style>
</head>

 testi:[['Sneha and Vikram','Wedding in Bangalore','One person handled everything, from the first call to the album. No chasing anyone.'],['Pooja and Nikhil','Pre-wedding and wedding','They knew when to step forward and when to let the moment breathe.'],['Lakshmi and Sandeep','Multi-day wedding','Fast delivery and a photobook we show to everyone who visits.']],
 pk:[{name:'Essential Package',price:'Price on enquiry',R:['Candid photography','Videography'],M:['Candid photography','Videography'],d:['Edited photographs','Wedding highlight film','Online gallery']},
 {name:'Signature Package',price:'Price on enquiry',R:['Candid and traditional photography','Cinematic videography'],M:['Candid and traditional photography','Cinematic videography'],d:['Edited photographs','Cinematic wedding film','Teaser film','Bespoke photobook']}]}

const DEFAULT={
  home:{h1:'We\u2019re not just helping you\ninvite guests anymore\u2026',
    p:'**King of Cards** has collaborated with **wedding photography** and **Return Gifts** partners to bring you more ways to make your special day unforgettable.',
    cards:[{t:'Wedding photography',d:'Every smile, every ritual, every emotional moment \u2014 captured beautifully so you can relive it for years to come.'},
           {t:'Return Gifts',d:'Make your celebrations more thoughtful with beautiful gifts for family, friends and wedding guests.'}]},
  photoPage:{t:'Photography Partners',s:'Discover top **wedding photographers**, explore their work and packages, and find your perfect team.'},
  giftPage:{t:'Return Gifts',s:'Explore our trusted gifting partners for the perfect wedding return gifts, guest hampers, and thoughtful presents for family and loved ones.'},
  photo:PHOTO,how:HOW,gift:GIFT,ghow:GHOW,occ:OCC
};
let C=structuredClone(DEFAULT);

// Cloudflare Worker API (images and videos are stored in R2 through it)
const API_URL = "https://king-of-cards-image-api.aamantriteinvitation.workers.dev";

const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
let MEDIA={},leads=[],curP=null,curG=null;

/* ---------- admin session ---------- */
let TOKEN='',isAdmin=false;
try{TOKEN=localStorage.getItem('koc_admin')||''}catch(e){}
async function checkAdmin(token){
  // returns the HTTP status, or 0 if the request never reached the worker
  try{const r=await fetch(API_URL+'/api/admin-check',{headers:{Authorization:'Bearer '+token}});return r.status}catch(e){return 0}
}
function login(){
  $('#lpass').value='';$('#lerr').textContent='';$('#lpass').type='password';$('#lshow').checked=false;
  $('#loginbox').classList.add('on');
  setTimeout(()=>$('#lpass').focus(),30);
}
function closeLogin(){$('#loginbox').classList.remove('on')}
async function doLogin(){
  const t=$('#lpass').value.trim(),err=$('#lerr');
  if(!t){err.textContent='Enter the password.';return}
  $('#lgo').disabled=true;err.textContent='Checking…';
  const st=await checkAdmin(t);
  $('#lgo').disabled=false;
  if(st===200){
    TOKEN=t;try{localStorage.setItem('koc_admin',t)}catch(e){}
    isAdmin=true;closeLogin();applyAdmin();toast('Admin mode on');
  }else if(st===401)err.textContent='Incorrect password.';
  else if(st===0)err.textContent='Could not reach the server. Open this page from king-of-cards.github.io or 127.0.0.1:5500, not as a local file.';
  else err.textContent='Server error ('+st+'). Try again.';
}
$('#lgo').onclick=doLogin;
$('#lcancel').onclick=closeLogin;
$('#lshow').onchange=e=>{$('#lpass').type=e.target.checked?'text':'password'};
$('#lpass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('#loginbox').addEventListener('click',e=>{if(e.target.id==='loginbox')closeLogin()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLogin()});
function applyAdmin(){
  $('#adminbar').classList.toggle('on',isAdmin);
  $('#adminlink').style.display=isAdmin?'none':'';
  render();
}
async function initAdmin(){
  if(TOKEN){
    const st=await checkAdmin(TOKEN);
    if(st===200)isAdmin=true;
    else if(st===401){TOKEN='';try{localStorage.removeItem('koc_admin')}catch(e){}}
  }
  $('#adminbar').classList.toggle('on',isAdmin);
  $('#adminlink').style.display=isAdmin?'none':'';
  if(location.hash==='#admin'&&!isAdmin){history.replaceState(null,'',location.pathname+location.search);login()}
}
$('#adminlink').onclick=login;
$('#logout').onclick=()=>{try{localStorage.removeItem('koc_admin')}catch(e){}TOKEN='';isAdmin=false;applyAdmin()};

let videoUploading = false;

function showVideoUpload() {
  videoUploading = true;

  document.getElementById('videoUploadOverlay')

    .style.display = 'block';

  document.getElementById('videoUploadTitle')
    .textContent = 'Uploading video...';

  document.getElementById('videoUploadMessage')
    .textContent = 'Please wait. Do not close or refresh this page.';

  document.getElementById('videoUploadClose')
    .style.display = 'none';
}

function finishVideoUpload(success, message) {
  videoUploading = false;

  document.getElementById('videoUploadSpinner')
    .style.display = 'none';

  document.getElementById('videoUploadTitle')
    .textContent = success
      ? 'Video updated successfully!'
      : 'Video upload failed';

  document.getElementById('videoUploadMessage')
    .textContent = message;

  document.getElementById('videoUploadClose')
    .style.display = 'inline-block';
}

function closeVideoUpload() {
  if (videoUploading) return;

  document.getElementById('videoUploadOverlay')
    .classList.remove('active');
}
let tt;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',bad?9000:2200)}
const isVideoUrl=u=>/\.(mp4|webm)$/i.test(u||'');
const single=k=>typeof MEDIA[k]==='string'?MEDIA[k]:'';
const list=k=>Array.isArray(MEDIA[k])?MEDIA[k]:[];

async function load(){
  try{
    const r=await fetch(API_URL+'/api/images',{cache:'no-store'});
    const j=await r.json();
    MEDIA=j.images||{};
  }catch(e){toast('Could not load images',1)}
  render();
}
async function api(method,slot,opts={}){
  const q=new URLSearchParams({slot});
  if(opts.index!==undefined)q.set('index',opts.index);
  let body;const headers={Authorization:'Bearer '+TOKEN};
  if(opts.raw){body=opts.file;headers['Content-Type']=opts.file.type}   // big videos: stream the file as-is
  else if(opts.file){body=new FormData();body.append('file',opts.file)}
  const r=await fetch(`${API_URL}/api/images?${q}`,{method,headers,body});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}

/* resize big photos before upload (GIFs are sent untouched) */
const shrink=f=>f.type==='image/gif'?Promise.resolve(f):new Promise(res=>{
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{
    const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>res(b?new File([b],'image.jpg',{type:'image/jpeg'}):f),'image/jpeg',.85)
  };
  im.onerror=()=>res(f);im.src=u;
});

/* ---------- navigation ---------- */
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));scrollTo(0,0)}
document.addEventListener('click',async e=>{
  const t=e.target.closest.bind(e.target);let b;
  if(b=t('[data-go]'))show(b.dataset.go);
  if(b=t('[data-vendor]'))openVendor(b.dataset.vendor);
  if(b=t('[data-gvendor]'))openGift(b.dataset.gvendor);
  if(b=t('[data-del]')){
    e.preventDefault();if(!isAdmin)return;
    const[k,i]=b.dataset.del.split('|');
    if(!confirm('Remove this photo?'))return;
    try{await api('DELETE',k,{index:+i});await load();toast('Removed')}catch(err){toast('Delete failed: '+err.message,1)}
  }
  if(b=t('[data-pick]')){const s=$('#leadform select');if(s)s.value=b.dataset.pick;$('#leadform').scrollIntoView({behavior:'smooth'})}
});
/* ---------- media components ---------- */
document.addEventListener('change', async e => {
  const i = e.target;
  const d = i.dataset;

  if (!isAdmin || !i.files || !i.files.length) return;

  // Prevent duplicate video uploads
  if (videoUploading) {
    i.value = '';
    return;
  }

  const isVideo = Boolean(d.vid);

  try {
    if (isVideo) {
      let f = i.files[0];

      if (!f.type) {
        const ext = f.name.split('.').pop().toLowerCase();
        const type = {
          mp4: 'video/mp4',
          webm: 'video/webm'
        }[ext] || '';

        f = new File([f], f.name, { type });
      }

      if (!/^video\/(mp4|webm)$/.test(f.type)) {
        toast('Only MP4 and WebM videos are supported', 1);
        return;
      }

      if (f.size > 95 * 1024 * 1024) {
        toast('Maximum video size is 95 MB', 1);
        return;
      }

      showVideoUpload();

      await api('PUT', d.vid, { file: f });

      // Refresh media only after upload succeeds
      await load();

      finishVideoUpload(
        true,
        'Your new video has been uploaded and is ready.'
      );

    } else if (d.key) {
      toast('Uploading image...');
      await api('PUT', d.key, {
        file: await shrink(i.files[0])
      });
      await load();
      toast('Saved');

    } else if (d.multi) {
      let n = 0;

      for (const f of i.files) {
        toast(`Uploading ${++n} of ${i.files.length}...`);
        await api('POST', d.multi, {
          file: await shrink(f)
        });
      }

      await load();
      toast('Saved');

    } else if (d.replace) {
      const [k, ix] = d.replace.split('|');

      await api('PUT', k, {
        file: await shrink(i.files[0]),
        index: +ix
      });

      await load();
      toast('Saved');
    }

  } catch (err) {
    if (isVideo) {
      finishVideoUpload(false, err.message);
    } else {
      toast('Upload failed: ' + err.message, 1);
    }

  } finally {
    i.value = '';
  }
});

/* ---------- media components ---------- */
const frame=(key,label,ar)=>{
  const s=single(key),img=s&&!isVideoUrl(s);
  const inner=img?`<img src="${s}" alt="${esc(label)}" loading="lazy">`
    :`<div class="ph" style="--ar:${ar||'4/3'}"><span>${isAdmin?`+ Add image<br><small>${esc(label)}</small>`:''}</span></div>`;
  return isAdmin?`<label class="fr">${inner}${img?'<span class="chg">✎ Change image</span>':''}<input class="vh" type="file" accept="image/jpeg,image/png,image/webp,image/gif" data-key="${key}"></label>`
                :`<div class="fr">${inner}</div>`;
};
const vframe=(key,label)=>{
  const s=single(key),vid=s&&isVideoUrl(s);
  const inner=vid?`<video src="${s}" autoplay muted loop playsinline controls></video>`
    :`<div class="ph" style="--ar:16/9"><span>${isAdmin?`+ Add landscape video<br><small>${esc(label)}</small>`:''}</span></div>`;
  const inp=`<input class="vh" type="file" accept="video/mp4,video/webm" data-vid="${key}">`;
  if(!isAdmin)return `<div class="fr">${inner}</div>`;
  // A video with controls swallows clicks, so the button is its own label on top of it
  return vid?`<div class="fr">${inner}<label class="chg vchg">✎ Change video${inp}</label></div>`
            :`<label class="fr">${inner}${inp}</label>`;
};
const gallery=(key,label)=>{
  const a=list(key);
  return `<div class="mas">${a.map((s,i)=>`<figure><img src="${s}" alt="${esc(label)}" loading="lazy">${isAdmin?`<label class="del rep" title="Replace this photo">✎<input class="vh" type="file" accept="image/jpeg,image/png,image/webp,image/gif" data-replace="${key}|${i}"></label><button class="del" data-del="${key}|${i}" aria-label="Remove photo">×</button>`:''}</figure>`).join('')}</div>${a.length?'':(isAdmin?`<p class="sub">No photos yet.</p>`:'')}${isAdmin?`<label class="btn ghost">+ Add photos<input class="vh" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple data-multi="${key}"></label>`:''}`;
};

/* ---------- editable content helpers ---------- */
const getP=p=>p.split('.').reduce((o,k)=>o==null?o:o[k],C);
const setP=(p,v)=>{const ks=p.split('.'),last=ks.pop();ks.reduce((o,k)=>o[k],C)[last]=v};
const E=p=>` data-path="${p}"`+(isAdmin?' contenteditable="true" spellcheck="false"':'');
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const raw=s=>esc(s).replace(/\n/g,'<br>');
const T=p=>{const s=String(getP(p)??'');return isAdmin?raw(s):fmt(s)};   // allows **bold**
const X=p=>esc(String(getP(p)??''));                                    // plain text
function setEd(el,path,html){
  el.innerHTML=html;el.dataset.path=path;
  if(isAdmin){el.contentEditable='true';el.spellcheck=false}else el.removeAttribute('contenteditable');
}
const lis=(path,arr)=>arr.map((x,i)=>`<li><span${E(path+'.'+i)}>${esc(x)}</span>${isAdmin?`<button class="rm" data-rm="${path}|${i}" title="Remove" aria-label="Remove item">×</button>`:''}</li>`).join('')+(isAdmin?`<li class="addli"><button class="addb" data-add="${path}">+ Add item</button></li>`:'');
const pts=(path,arr)=>`<ul class="pts">${lis(path,arr)}</ul>`;
const testi=(a,k,path)=>`<div class="grid g3" style="margin-top:0">${a.map((t,i)=>{
  const im=single(k+i),inner=im&&!isVideoUrl(im)?`<img src="${im}" alt="${esc(t[0])}">`:esc((t[0]||'?')[0]);
  const av=isAdmin?`<label class="av" title="Click to add photo">${inner}<input class="vh" type="file" accept="image/jpeg,image/png,image/webp,image/gif" data-key="${k+i}"></label>`:`<div class="av">${inner}</div>`;
  const b=path+'.'+i;
  return `<div class="q"><div class="stars" aria-label="5 out of 5">★★★★★</div><p>\u201C<span${E(b+'.2')}>${esc(t[2])}</span>\u201D</p><div class="who">${av}<div><b${E(b+'.0')}>${esc(t[0])}</b><span class="ev"${E(b+'.1')}>${esc(t[1])}</span></div></div></div>`}).join('')}</div>`;
const sec=(t,b)=>`<h3 class="hd">${t}</h3>${b}`;

/* typing updates the content object; nothing is live until you press Save */
let dirty=false;
function markDirty(){dirty=true;$('#save').disabled=false}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('input',e=>{
  const el=e.target.closest&&e.target.closest('[data-path]');
  if(!isAdmin||!el||!el.isContentEditable)return;
  setP(el.dataset.path,el.innerText.replace(/\u00a0/g,' '));markDirty();
});
document.addEventListener('keydown',e=>{
  const el=e.target.closest&&e.target.closest('[data-path][contenteditable]');
  if(el&&e.key==='Enter'){e.preventDefault();if(el.dataset.path==='home.h1')document.execCommand('insertLineBreak')}
});
document.addEventListener('paste',e=>{
  const el=e.target.closest&&e.target.closest('[data-path][contenteditable]');
  if(!el)return;e.preventDefault();
  const t=((e.clipboardData||window.clipboardData).getData('text/plain')||'').replace(/\s*\n\s*/g,' ');
  document.execCommand('insertText',false,t);
});
document.addEventListener('click',e=>{
  if(!isAdmin)return;
  const rm=e.target.closest('[data-rm]'),ad=e.target.closest('[data-add]');
  if(rm){const[p,i]=rm.dataset.rm.split('|');getP(p).splice(+i,1);markDirty();render()}
  else if(ad){getP(ad.dataset.add).push('New item');markDirty();render()}
});

const LISTK=['usp','exp','R','M','d'];
const clean=(v,k)=>{
  if(Array.isArray(v)){const a=v.map(x=>clean(x));return LISTK.includes(k)?a.filter(x=>x!==''):a}
  if(v&&typeof v==='object')return Object.fromEntries(Object.entries(v).map(([kk,x])=>[kk,clean(x,kk)]));
  return typeof v==='string'?v.trim():v;
};
async function saveContent(){
  const body=JSON.stringify(clean(C));
  $('#save').disabled=true;toast('Saving…');
  try{
    const r=await fetch(API_URL+'/api/content',{method:'PUT',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    C=JSON.parse(body);dirty=false;render();toast('Saved. Changes are live');
  }catch(err){$('#save').disabled=false;toast('Save failed: '+err.message,1)}
}
async function loadContent(){
  try{
    const r=await fetch(API_URL+'/api/content',{cache:'no-store'}),j=await r.json();
    C=structuredClone(DEFAULT);
    if(j.content&&typeof j.content==='object')for(const k of Object.keys(DEFAULT))if(j.content[k]!==undefined)C[k]=j.content[k];
  }catch(e){}
  dirty=false;$('#save').disabled=true;render();
}
$('#save').onclick=saveContent;
$('#discard').onclick=()=>{if(dirty&&!confirm('Discard unsaved text changes?'))return;loadContent()};

/* ---------- lead form ---------- */
function leadForm(service,vendor,opts){
  return `<div class="lead" id="leadform"><h3>Your details</h3><p>Share your name and phone number. ${vendor} will call you.</p>
  <form data-service="${service}" data-vendor="${vendor}" novalidate>
    <input name="name" placeholder="Your name" aria-label="Your name" autocomplete="name">
    <input name="phone" placeholder="10-digit phone number" aria-label="Phone number" inputmode="numeric" autocomplete="tel">
    ${opts?`<select name="pkg" aria-label="Package">${opts.map(o=>`<option>${o}</option>`).join('')}</select>`:''}
    <button class="btn" type="submit">Request a call</button><div class="err" role="alert"></div></form></div>`;
}
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,n=f.name.value.trim(),p=f.phone.value.replace(/[\s-]/g,'').replace(/^(\+91|0)/,''),err=f.querySelector('.err');
  if(n.length<2){err.textContent='Enter your name.';return}
  if(!/^[6-9]\d{9}$/.test(p)){err.textContent='Enter a valid 10-digit mobile number.';return}
  leads.unshift({name:n,phone:p,service:f.dataset.service+(f.elements.pkg?' - '+f.elements.pkg.value:''),vendor:f.dataset.vendor,time:new Date().toLocaleString()});
  try{localStorage.setItem('koc_leads',JSON.stringify(leads))}catch(x){}
  f.parentElement.innerHTML=`<div class="ok">Thank you, ${esc(n)}. ${f.dataset.vendor} will call you on ${p} soon.</div>`;
});

/* ---------- views ---------- */

  return `<article class="card pkg"><h3${E(b+'.name')}>${esc(p.name)}</h3><div class="price"${E(b+'.price')}>${esc(p.price)}</div>
 <div class="cols"><div><h4>Reception</h4><ul>${lis(b+'.R',p.R)}</ul></div><div><h4>Muhurtham</h4><ul>${lis(b+'.M',p.M)}</ul></div></div>
 <h4>Deliverables</h4><ul>${lis(b+'.d',p.d)}</ul><button class="btn" style="margin-top:18px" data-pick="${esc(p.name)}">Choose package</button></article>`;
}
const customCard=`<article class="card pkg"><h3>Customised Package</h3><div class="price">Built around you</div><p class="sub">Tell us your events, team size and deliverables, and we will build a package that fits your wedding and budget.</p><button class="btn" style="margin-top:18px" data-pick="Customised Package">Choose package</button></article>`;

  setEd($('#heroH1'),'home.h1',T('home.h1'));
  setEd($('#heroP'),'home.p',T('home.p'));
  setEd($('#photoT'),'photoPage.t',X('photoPage.t'));
  setEd($('#photoS'),'photoPage.s',T('photoPage.s'));

  $('#homeCards').innerHTML=['photo','gift'].map((k,i)=>`<article class="card vendor">${frame('home-'+k,C.home.cards[i].t+' image')}<div class="body"><h3${E(`home.cards.${i}.t`)}>${X(`home.cards.${i}.t`)}</h3><p style="margin:6px 0 18px;color:var(--mut)"${E(`home.cards.${i}.d`)}>${X(`home.cards.${i}.d`)}</p><button class="btn" data-go="${k}">Explore</button></div></article>`).join('');

  $('#giftBody').innerHTML=C.gift.map((v,vi)=>`<article class="card vendor">${frame('gcover-'+v.id,v.name+' cover')}<div class="body"><h3${E(`gift.${vi}.name`)}>${esc(v.name)}</h3><div class="tag"${E(`gift.${vi}.tag`)}>${esc(v.tag)}</div><p style="margin-bottom:18px;color:var(--mut)"${E(`gift.${vi}.desc`)}>${esc(v.desc)}</p><button class="btn" data-gvendor="${v.id}">Explore</button></div></article>`).join('');
  if($('#vendor').classList.contains('on'))openVendor(curP,1);

function openVendor(id,stay){

}
function openGift(id,stay){

  $('#giftVendorBody').innerHTML=`<h2 class="vname"${E(`gift.${vi}.name`)}>${esc(v.name)}</h2><p class="vtag"${E(`gift.${vi}.tag`)}>${esc(v.tag)}</p><div style="margin-top:18px">${frame('gban-'+id,v.name+' landscape banner','16/9')}</div>

render();                                   // show the page immediately
initAdmin().then(()=>{load();loadContent()}); // then pull images and text from the API
